server:
  port: 10030
spring:
    application:
      name: gateway
    cloud:
      nacos:
        discovery:
          server-addr: 101.34.79.17:8848
      gateway:
        metrics:
          enabled: true
        routes:
          - id: order-server  #路由名称
            uri: lb://order-server  #路由路径(这里使用了loadbalancer)
            predicates:   #设置需要路由的地址
              - Path=/order/**,/feign/**
            filters:
              - AddRequestParameter=userName, aaaa
              - name: Custom  #过滤器名称
                args:
                  name: test_custom

          - id: product-service
            uri: lb://product-service
            predicates:
              - Path=/product/**
        default-filters:
          - name: Retry
            args:
              retries: 3
              statuses: BAD_GATEWAY

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    shutdown:
      enabled: true