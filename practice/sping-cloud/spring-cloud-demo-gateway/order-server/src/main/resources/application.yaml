server:
  port: 8080
spring:
  application:
    name: order-server
  profiles:
    active: @profile.name@
  cloud:
    nacos:
      discovery:
        server-addr: 101.34.79.17:8848
        cluster-name: WH
#        ephemeral: false 是否临时实例
#        namespace: 5b4d0693-0261-4baf-bf3b-9dfafb35ece6
    #开启nacos的负载均衡
    loadbalancer:
      nacos:
        enabled: true
# 设置 Mybatis 的 xml 保存路径
mybatis:
  mapper-locations: classpath:mapper/*Mapper.xml
  configuration: # 配置打印 MyBatis 执行的 SQL
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true  #自动驼峰转换
